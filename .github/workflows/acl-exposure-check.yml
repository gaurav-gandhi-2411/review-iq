name: ACL Exposure Check

# Wave 2 P1: standing audit for the Supabase default-ACL exposure class (Wave 1 S0
# finding -- a SECURITY DEFINER function inheriting EXECUTE on anon/authenticated via
# Supabase's schema-level default ACLs, reachable directly via PostgREST regardless of
# the app's own auth). scripts/check_acl_exposure.py queries the LIVE schema (not just
# migration-file text -- catches out-of-band-created objects too, e.g.
# public.quota_requests) for any table/view/SECURITY DEFINER function missing its
# protective revoke/anon-deny-policy, unless explicitly and justifiably allowlisted.
#
# Runs nightly (backfill-verify against schema drift) and on every push touching
# supabase/migrations/** (fast feedback on a new migration introducing the gap).
#
# Reuses the existing SUPABASE_DIRECT_URL secret (already configured for
# db-backup.yml) -- no new secret needed. Per that workflow's own note, this must be
# the session-mode pooler URL (IPv4, port 5432), not the literal db.<ref>.supabase.co
# host (IPv6-only, unreachable from GitHub's runners).

on:
  schedule:
    - cron: "30 3 * * *"
  push:
    paths:
      - "supabase/migrations/**"
      - "scripts/check_acl_exposure.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acl-exposure-check
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
    steps:
      - name: Validate secret is present
        run: |
          if [ -z "$SUPABASE_DIRECT_URL" ]; then
            echo "::error::SUPABASE_DIRECT_URL secret is not set. Add it in Settings -> Secrets -> Actions (same value already used by db-backup.yml)."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ACL exposure audit
        run: uv run python scripts/check_acl_exposure.py --ci
