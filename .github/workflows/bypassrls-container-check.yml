name: Security — BYPASSRLS check (throwaway Postgres, no prod credential)

# Item 135/136/142: supersedes security-bypassrls-check.yml -- that workflow needed a
# production database credential (SUPABASE_DATABASE_URL) added to GitHub Actions
# secrets, which was never done (see that workflow's own comments) and duplicates a
# credential that already exists in GCP Secret Manager. This version applies the
# repo's own tracked migrations to a throwaway postgres:16 service container instead --
# no production credential anywhere in this workflow, ever.
#
# Confirmed feasible end-to-end (Item 135/141/142): the repo's schema lives entirely in
# version-controlled migrations (supabase/migrations/), none of which depend on a
# Supabase-managed extension or schema -- grepped for auth.*/pgjwt/pg_net/pgsodium/
# realtime.* across all 26 migrations, found only two comments about *future*,
# not-yet-wired-in auth integration. The only real gap (public.quota_requests and
# public.extraction_costs existing in production but never captured in a migration)
# is fixed on the branch this workflow ships alongside (Item 141).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch: {}

jobs:
  bypassrls-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Bootstrap Supabase-platform roles (anon, authenticated, service_role)
        run: psql "postgresql://postgres:postgres@localhost:5432/postgres" -f supabase/bootstrap_local_roles.sql

      - name: Apply all migrations
        env:
          SUPABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run python supabase/push.py

      # Item 172/173: the S0 BYPASSRLS revocation (statement 4 of 20260801000001) moved
      # to supabase/cutover/ -- outside push.py's glob on purpose, so it's never a side
      # effect of an unrelated push.py run. This CI check's whole point is proving the
      # FULL intended end state (review_iq_app without BYPASSRLS) is reachable, so it
      # applies the cutover step explicitly here as its own step -- exactly mirroring how
      # a real cutover must run it: separately, deliberately, never bundled.
      - name: Apply cutover statements (explicit, separate from the tracked migrations)
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 \
            -f supabase/cutover/20260801000001_statement4_revoke_bypassrls.sql

      # Item 224/225: SUPABASE_DIRECT_URL added alongside SUPABASE_DATABASE_URL --
      # test_role_bypassrls.py's cross-org sweep fixtures need a superuser connection to
      # seed rows across two orgs, and use SUPABASE_DIRECT_URL for that (the same var
      # both this workflow's own migration-apply step above and
      # pre-cutover-verification.yml already use for a direct postgres-superuser
      # connection, for exactly this purpose). Without it here, those fixtures fell back
      # to _superuser_db_params()'s production-host default and failed with "Network is
      # unreachable" from inside the runner -- caught by this exact workflow, not before.
      - name: BYPASSRLS regression check (throwaway container, no prod credential)
        env:
          SUPABASE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          SUPABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: uv run pytest tests/integration/test_role_bypassrls.py -v -m integration --no-cov
