name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy app/

      - name: Tenant-scoping guard (psycopg2 connect sites)
        run: uv run python scripts/check_undocumented_pg_connects.py

      # Session 15c: every scheduled workflow must have a failure -> GitHub-issue alert path.
      # failover-probe.yml failed 7 nights unalerted; the runtime canary only covers the
      # composite action, so this is the static check that every caller actually uses it.
      - name: Scheduled workflows have a failure-alert path
        run: uv run python scripts/check_scheduled_workflows_alert.py

      # The ephemeral-Postgres jobs apply the NOBYPASSRLS cutover AFTER all migrations, so
      # they stay green if a migration re-grants BYPASSRLS; this catches it statically.
      - name: No migration grants BYPASSRLS (outside allowlist)
        run: uv run python scripts/check_migrations_no_bypassrls_grant.py

      # Session 15d: a migration that "ran without error" is not one whose effect is true (a
      # non-owner REVOKE silently changes nothing). push.py refuses to apply/ledger a file with
      # no postcondition; this fails the PR first, statically, with no database.
      - name: Every migration declares a well-formed postcondition
        run: uv run python scripts/check_migrations_have_postconditions.py

      - name: Unit tests
        # Was `pytest tests/unit/` only -- silently excluded ~9 flat test files directly
        # under tests/ (test_providers.py, test_failover.py, the new test_probe_failover.py,
        # etc.), including this Section F change's own SecondaryProvider/failover tests.
        # Verified all 1059 tests (tests/unit/ + flat tests/, excluding integration/
        # benchmark which need a live DB / are long-running) pass together before widening
        # this gate (2026-07-31).
        run: uv run pytest tests/ --ignore=tests/integration --ignore=tests/benchmark -v

      # Truth-reconciliation gates (Wave 1 Section A) -- see
      # docs/architecture/adr/0001-eval-gate-and-prompt-version-reconciliation.md.
      - name: No hand-typed accuracy numbers in docs
        run: uv run python scripts/check_no_hardcoded_metrics.py

      - name: Metrics render drift check (README/site vs eval JSON)
        run: uv run python scripts/render_metrics.py --check

      # Session 8 P3: eval/fixtures/_held_out_hindi_hinglish/'s entire value depends on
      # nobody having seen its content while developing app/core/prompts/**. See that
      # directory's own README.md for the full quarantine mechanism.
      - name: Held-out corpus leakage check
        run: uv run python scripts/check_no_heldout_leakage.py

      # Catches the exact 2026-08-16/22 incident class: a config-only model-name
      # change silently invalidating eval/results.json's claim, undetected because
      # nothing re-ran the eval. See scripts/check_eval_model_matches_config.py.
      - name: Eval model config matches deployed defaults
        run: uv run python scripts/check_eval_model_matches_config.py

      # Visual-identity gate (Session 12 P6a, recovering Wave 1 Section D work that was
      # found merged on GitHub but absent from main's actual history -- see PR body) --
      # fails if a brand colour pair in design/tokens.json drops below its documented
      # WCAG AA minRatio, or if a documented known-failing pair silently stops failing
      # (stale docs either way).
      - name: WCAG AA contrast check (design tokens)
        run: uv run python scripts/check_contrast.py

      # Mechanical proof that eval/results.json + eval/results/latest.json qualify for rule
      # 70a gate 3's generated-artifact carve-out (CLAUDE.md rule 39b): regenerates both via
      # cassette replay ($0, deterministic) and fails if the substantive content (everything
      # except generated_at/git_sha/mode/per-fixture latency_ms, which legitimately vary run
      # to run) differs from what's committed -- catches a hand-edit or stale commit.
      - name: Eval results reproducibility (gate-3 carve-out proof)
        env:
          EVAL_CASSETTE_MODE: replay
          API_KEY: ci-key
        run: uv run python scripts/check_eval_results_reproducible.py

      # Mechanical proof that eval/results/known_gaps_n106.json qualifies for rule 70a gate 3's
      # generated-artifact carve-out (Session 14 P2, PR #188): regenerates it via
      # eval/analyze_known_gaps.py ($0, deterministic, no live LLM calls) and fails on any
      # drift from what's committed.
      - name: Known-gaps measurement reproducibility (gate-3 carve-out proof)
        run: uv run python scripts/check_known_gaps_reproducible.py

      # Mechanical proof that eval/results/grounding_check_fpr_n106.json qualifies for rule
      # 70a gate 3's generated-artifact carve-out (Session 14 P4c, PR #189): regenerates it via
      # eval/measure_grounding_check.py ($0, deterministic, no live LLM calls) and fails on any
      # drift from what's committed.
      - name: Grounding-check FPR reproducibility (gate-3 carve-out proof)
        run: uv run python scripts/check_grounding_check_reproducible.py

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Non-blocking dependency vulnerability scan (informational only, per T1 audit policy).
      - name: pip-audit (non-blocking)
        continue-on-error: true
        run: uvx pip-audit

  manifest-provenance:
    # 2026-08-05 audit: a metric in .portfolio/metrics.json without a
    # committed artifact behind it can silently drift from what the portfolio
    # site shows, with nobody able to tell -- this is a build failure, not a
    # warning. See gg-portfolio's provenance.md wave 19 section.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Every manifest metric must have a committed artifact
        run: python scripts/check_manifest_provenance.py

  npm-audit:
    # Wave 2 P2: Section E's CVE gate only ever covered app/'s Python dependencies --
    # web/ (259 npm packages) had zero automated vulnerability scanning of any kind
    # until this job. Blocking at the same high/critical threshold pip-audit uses
    # (once PR #33/#27's blocking pip-audit lands) -- unlike pip-audit, npm's own
    # `--audit-level` flag natively distinguishes severity, so no custom gate script
    # is needed here the way pip_audit_gate.py was for pip-audit's severity-blind JSON.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Blocking gate: fail the build on any HIGH/CRITICAL-severity CVE. MODERATE/LOW
      # findings remain informational only, matching the Python gate's own threshold.
      - name: npm audit (blocking on high/critical CVEs)
        working-directory: web
        run: npm audit --audit-level=high

  web-build:
    # Session 15c S3: web/ had NO lint/typecheck/build gate. npm-audit above only runs
    # `npm ci` + audit, so dependabot PR #106 (tailwindcss 4, breaks the PostCSS config)
    # showed CLEAN with green CI while `vite build` failed, and Vercel's ignoreCommand
    # (web/vercel.json) skipped its preview build too -- nothing checked it. A blank page
    # has shipped before. Typecheck and vite build are separate steps (rather than one
    # `npm run build`) so the failing step names which of them broke. No `paths:` filter
    # on purpose: a lockfile-only or workflow-only change must still run this.
    runs-on: ubuntu-latest
    # Job-level (not workflow-level) so the existing jobs' behaviour is untouched. Cancel
    # superseded PR runs only; a push to main always runs to completion.
    concurrency:
      group: web-build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      # PLACEHOLDER, non-secret values -- only so web/scripts/validate-env.mjs (the real
      # build-time env check) runs and passes. They are baked into a throwaway CI bundle
      # that is never deployed. Real values live in Vercel; never put a secret here.
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key-not-a-secret
      VITE_API_URL: https://placeholder.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (npm ci)
        working-directory: web
        run: npm ci

      - name: Validate build env (validate-env.mjs)
        working-directory: web
        run: node scripts/validate-env.mjs

      - name: Lint (eslint)
        working-directory: web
        run: npm run lint

      - name: Typecheck (tsc -b)
        working-directory: web
        run: npx tsc -b

      - name: Build (vite build)
        working-directory: web
        run: npx vite build

      # An empty or partial build must not pass: index.html has to exist and reference at
      # least one hashed JS asset that is actually on disk.
      - name: Smoke-check build output (dist/index.html + hashed JS asset)
        working-directory: web
        run: |
          test -f dist/index.html || { echo "FAIL: dist/index.html missing"; exit 1; }
          asset=$(grep -oE 'assets/[^"]+-[A-Za-z0-9_-]{6,}\.js' dist/index.html | head -n 1)
          test -n "$asset" || { echo "FAIL: dist/index.html references no hashed JS asset"; exit 1; }
          test -s "dist/$asset" || { echo "FAIL: dist/$asset missing or empty"; exit 1; }
          echo "OK: dist/index.html -> dist/$asset"

