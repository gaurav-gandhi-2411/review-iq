name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy app/

      - name: Tenant-scoping guard (psycopg2 connect sites)
        run: uv run python scripts/check_undocumented_pg_connects.py

      - name: Unit tests
        run: uv run pytest tests/unit/ -v

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Non-blocking dependency vulnerability scan (informational only, per T1 audit policy).
      - name: pip-audit (non-blocking)
        continue-on-error: true
        run: uvx pip-audit

  manifest-provenance:
    # 2026-08-05 audit: a metric in .portfolio/metrics.json without a
    # committed artifact behind it can silently drift from what the portfolio
    # site shows, with nobody able to tell -- this is a build failure, not a
    # warning. See gg-portfolio's provenance.md wave 19 section.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Every manifest metric must have a committed artifact
        run: python scripts/check_manifest_provenance.py

