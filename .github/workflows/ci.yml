name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy app/

      - name: Unit tests
        run: uv run pytest tests/unit/ -v

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Export the resolved lockfile to requirements format rather than auditing an
      # active venv: pip-audit's default PipSource resolves via whatever `python`/`pip`
      # is first on PATH, which is not reliably `.venv` across shells/runners (verified
      # locally: it silently audited an unrelated conda base env). --no-emit-project
      # drops the local editable install, which pip-audit can't hash-verify.
      - name: Export lockfile for audit
        run: uv export --format requirements.txt --no-header --no-emit-project -o requirements-audit.txt

      # Blocking gate: fail the build on any HIGH/CRITICAL-severity CVE. MODERATE/LOW
      # findings remain informational only (scripts/pip_audit_gate.py exits non-zero
      # only above that threshold) so the gate doesn't flap on low-severity noise.
      - name: pip-audit (blocking on high/critical CVEs)
        run: |
          uvx pip-audit -r requirements-audit.txt -f json | uv run python scripts/pip_audit_gate.py

