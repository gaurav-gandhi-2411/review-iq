name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy app/

      - name: Unit tests
        run: uv run pytest tests/unit/ -v

      # Truth-reconciliation gates (Wave 1 Section A) -- see
      # docs/architecture/adr/0001-eval-gate-and-prompt-version-reconciliation.md.
      - name: No hand-typed accuracy numbers in docs
        run: uv run python scripts/check_no_hardcoded_metrics.py

      - name: Metrics render drift check (README/site vs eval JSON)
        run: uv run python scripts/render_metrics.py --check

      # Domain-consolidation gate (Wave 1 Section C) -- fails on placeholder href="#"
      # links and on a missing/invalid site/demo-data.json (D1/D3 regression guard).
      - name: Link health (placeholder links + demo-data fixture)
        run: uv run python scripts/check_link_health.py

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Non-blocking dependency vulnerability scan (informational only, per T1 audit policy).
      - name: pip-audit (non-blocking)
        continue-on-error: true
        run: uvx pip-audit

