name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy app/

      - name: Unit tests
        # Was `pytest tests/unit/` only -- silently excluded ~9 flat test files directly
        # under tests/ (test_providers.py, test_failover.py, the new test_probe_failover.py,
        # etc.), including this Section F change's own SecondaryProvider/failover tests.
        # Verified all 1059 tests (tests/unit/ + flat tests/, excluding integration/
        # benchmark which need a live DB / are long-running) pass together before widening
        # this gate (2026-07-31).
        run: uv run pytest tests/ --ignore=tests/integration --ignore=tests/benchmark -v

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Non-blocking dependency vulnerability scan (informational only, per T1 audit policy).
      - name: pip-audit (non-blocking)
        continue-on-error: true
        run: uvx pip-audit

