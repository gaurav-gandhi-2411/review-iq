name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

# The push step below authenticates to Hugging Face with its own HF_TOKEN secret over
# HTTPS (git remote add hf ...) — it never touches GITHUB_TOKEN, so contents: write on
# the GitHub token is not required even though this workflow pushes somewhere.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "ci@review-iq"
          git config user.name "Review IQ CI"
          git remote add hf "https://gauravgandhi2411:${HF_TOKEN}@huggingface.co/spaces/gauravgandhi2411/review-iq"
          git push hf main --force
