name: Deploy to Hugging Face Spaces

# v1 HF Space is slated for retirement (Wave 1 spec §C — unauthenticated single-tenant
# SQLite service on the public internet is a security finding, not a demo). Auto-deploy on
# push is disabled so we stop shipping to a surface being retired; manual-only until then.
# Re-enable the push trigger only if retirement is reversed.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "ci@review-iq"
          git config user.name "Review IQ CI"
          git remote add hf "https://gauravgandhi2411:${HF_TOKEN}@huggingface.co/spaces/gauravgandhi2411/review-iq"
          git push hf main --force
