name: DIAG - WIF auth only (throwaway, Item 82b)

# Diagnostic only. No deploy, no environment gate (deploy-cloud-run.yml's job
# carries no `environment:` key, confirmed). Proves auth + a real API call
# work with the fix/reviewiq-wif-target branch's corrected vars before any
# real deploy is attempted. Delete before this branch merges.

on:
  push:
    branches: [fix/reviewiq-wif-target]

permissions:
  contents: read
  id-token: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@6a7c903a70c8625ed6700fa299f5ddb4ca6022e9 # v2.1.5

      - name: gcloud run services list
        run: gcloud run services list --project=reviewiq-prod-260813 --region=asia-south1
