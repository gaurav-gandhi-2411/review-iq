name: Eval

on:
  push:
    branches: [main]
    paths:
      # Deliberately the WHOLE app/core package, not an enumerated list of "the
      # files we think matter" -- that list already went stale once. c492e4a
      # changed app/core/config.py's default Groq model names, invalidated every
      # eval cassette (a cassette's lookup key incorporates the model name), and
      # never ran this workflow as a blocking check because config.py wasn't in
      # the old enumerated list (app/core/prompt.py, app/core/prompts/**,
      # app/core/llm.py, app/core/schemas.py, eval/fixtures/**, eval/runner.py).
      # Anything that changes how a review gets turned into a prompt, which
      # model/tier handles it, or how the response is parsed can invalidate a
      # cassette -- that is most of app/core/, not a hand-picked subset of it.
      # Eval CI is a $0, deterministic cassette replay, so running it on a false
      # positive (an unrelated app/core/ change) costs a few seconds; missing a
      # true positive cost 14 nights of a broken gate nobody noticed.
      - "app/core/**"
      - "eval/fixtures/**"
      - eval/runner.py
      # score_fixture() delegates the free-text fields here; a change to this file moves
      # every published number exactly like a change to runner.py does.
      - eval/free_text_scoring.py
      # The cassette store itself: the runner replays from it, so an edited/deleted/re-recorded
      # cassette moves the numbers exactly like a prompt change does. It was missing here.
      - eval/cassettes/**
      - .github/workflows/eval.yml
  # Session 15d U7b: the same replay, BEFORE merge. Until now this workflow ran only after a
  # change had already reached main (and nightly), so the accuracy-gate thresholds in
  # eval/runner.py were never enforced on a PR. lint-and-test already replays the cassettes on
  # every PR, but only via check_eval_results_reproducible.py, which accepts a gate FAIL as "a
  # valid regeneration outcome" -- a PR that commits its own regressed (regenerated) results
  # passes that check. This job is the one that fails on the gate itself.
  #
  # KEEP THIS `paths:` LIST IDENTICAL TO THE push LIST ABOVE (tests/unit/test_eval_workflow_paths.py
  # fails if they drift): the list going stale is exactly how c492e4a slipped through. Both
  # lists carry this file, so a change to the workflow is itself exercised.
  #
  # No secrets are needed or used on this path (cassette replay, no provider key), so fork PRs run
  # it too. The Slack step is gated to schedule/dispatch and the issue-alert step to non-PR events
  # below -- a PR run must neither open nor close the repo-wide "Eval CI is failing" issue.
  pull_request:
    branches: [main]
    paths:
      - "app/core/**"
      - "eval/fixtures/**"
      - eval/runner.py
      - eval/free_text_scoring.py
      - eval/cassettes/**
      - .github/workflows/eval.yml
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  eval:
    runs-on: ubuntu-latest
    # Job-level so push/schedule behaviour is untouched: cancel superseded PR runs only.
    concurrency:
      group: eval-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      # Eval CI replays recorded cassettes — ZERO live LLM calls, deterministic, $0, and
      # immune to free-tier daily-quota exhaustion (which takes down a live eval). No
      # GROQ/GEMINI key is provided on purpose: a missing cassette then fails LOUDLY
      # instead of silently making a live call. Re-record when prompts change — see
      # eval/README.md (standing rule).
      EVAL_CASSETTE_MODE: replay
      API_KEY: ci-key
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run eval
        id: run_eval
        run: uv run python -m eval.runner

      - name: Generate report
        if: always()
        run: uv run python -m eval.report

      # Makes a gate failure readable from the PR checks page without downloading the artifact.
      - name: Show report in the run summary
        if: always()
        run: |
          if [ -f eval/report.md ]; then
            cat eval/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify Slack
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # Free-tier-friendly: skip cleanly when no webhook is configured, so a
          # missing Slack secret never reds an otherwise-passing eval (dispatch/nightly).
          # NOTE: as of 2026-09, SLACK_WEBHOOK_URL has never actually been configured
          # (see docs/audit/2026-09-06-unwatched-scheduled-jobs.md) -- this step has
          # never sent a real notification. The GitHub-issue alert below does not
          # depend on this secret and is the actual safety net; this step is kept as
          # a no-op-safe path in case the webhook is added later, not relied upon.
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured — skipping eval notification."
            exit 0
          fi
          uv run python -m eval.slack_notify \
            --webhook "$SLACK_WEBHOOK_URL" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # Fires a GitHub issue on failure regardless of Slack config -- see
      # .github/actions/schedule-failure-alert. This is what would have caught the
      # 14-night silent Eval-CI-broken incident on night 2 instead of night 14.
      #
      # Skipped on pull_request: that issue tracks the state of main/nightly. A red PR is
      # already visible as a red check (and a fork PR's token cannot write issues), and a green
      # PR must not "recover" an alert that main itself still owes.
      - name: Alert on failure / close alert on recovery
        if: always() && github.event_name != 'pull_request'
        uses: ./.github/actions/schedule-failure-alert
        with:
          status: ${{ steps.run_eval.outcome == 'success' && 'success' || 'failure' }}
          title: "Eval CI is failing"
          details: |
            `eval.yml`'s eval step failed (triggered by `${{ github.event_name }}`).
            This gates the accuracy numbers this product is sold on -- see
            `eval/report.md` in the run's uploaded artifact for detail, and
            `docs/architecture/adr/` for prior incidents of this shape (a model/config
            change silently invalidating the eval, see the 2026-08-16 Groq deprecation
            incident).

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            eval/results.json
            eval/report.md
