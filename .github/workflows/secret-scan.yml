name: Secret Scan

# Wave 2 P1: Section E's secret scan (gitleaks+trufflehog, "1 real finding") was a one-time
# manual scan with zero continuous coverage on either side -- worse than the CVE gate's
# backend-only reach, since this repo has already leaked a live key once (the README/
# site "demo key" incident, ~23 days exposed, see plan.md's post-E remediation entry).
#
# Two triggers, matching the two things that need different depth:
#   - pull_request: diff-only (base...head) -- fast, every push, catches new commits.
#   - schedule (weekly): full history -- catches anything a narrower diff scan could miss
#     (e.g. a force-push that rewrote what "new commits" means).
#
# .gitleaksignore (fingerprint-only: commit:file:rule:line, no secret text -- a committed
# report containing the raw matched strings would itself trip GitHub's push protection and
# any future scan of this repo, which is exactly what happened building this gate) allowlists
# the 19 pre-existing, individually-verified-safe findings already in this repo's history
# (test fixtures with obviously-fake values, one OpenAPI docs example, and the two
# already-documented/accepted historical items -- the dead README/site demo key and a
# "your_key" placeholder). Findings it lists never fail this gate; anything NOT listed does.
# Adding a new fingerprint to silence a real new finding, instead of fixing/rotating it,
# defeats the entire point of this gate.
#
# Installs the gitleaks binary directly (sha256-verified against the project's own
# published checksums) rather than a third-party wrapper Action -- avoids depending on
# gitleaks-action's own licensing terms for a detail unrelated to what this gate needs.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "15 3 * * 1" # weekly, Monday 03:15 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.21.2"
  GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"

jobs:
  diff-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history needed so base...head diffing works on any PR size

      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Scan this PR's new commits only
        run: |
          ./gitleaks detect --source . \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --no-banner -v

  full-history-scan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Scan full history
        run: |
          ./gitleaks detect --source . --no-banner -v
