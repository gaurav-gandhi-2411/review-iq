name: Security — BYPASSRLS regression check

# Item 124: tests/integration/ has 15 files, none run in any CI workflow -- confirmed via
# grep across every workflow in this repo. This is the one exception: a read-only,
# zero-mutation check that the S0 BYPASSRLS remediation (review_iq_app must never hold
# BYPASSRLS; review_iq_migrator must) stays applied in production. It only SELECTs from
# pg_roles -- no writes, no test data created or deleted -- so it is safe to run on every
# push to main and on a schedule, unlike the other 14 integration test files (several of
# which write real rows to the live production database and need a separate, explicit
# risk decision before being wired into any automated run -- see the PR this workflow
# shipped in for that discussion).
#
# Item 240/241: test_role_bypassrls.py grew a second test class
# (TestCrossOrgSweepFunctionsSeeEveryOrg, Item 225) that seeds real rows across two orgs to
# prove 20260817000003's cross-org sweep functions work -- a real, if temporary, WRITE
# against whatever database SUPABASE_DIRECT_URL points at. That breaks this workflow's own
# read-only promise (the paragraph above) if run here unmodified, and would additionally
# require adding the postgres SUPERUSER connection string as a secret to a job that runs
# unattended on a schedule + every push to main -- a materially larger production credential
# footprint than the already-scoped-down review_iq_app DSN this workflow was designed
# around, for a check this workflow was never meant to make. Deselected below; that class is
# exercised safely against a throwaway container instead, by
# bypassrls-container-check.yml and pre-cutover-verification.yml.
#
# REQUIRES a GitHub Actions secret named SUPABASE_DATABASE_URL, added at the Production
# environment scope (this job declares `environment: Production` -- an environment-scoped
# secret is invisible to a job that doesn't declare a matching environment, and vice versa):
#   gh secret set SUPABASE_DATABASE_URL --repo gaurav-gandhi-2411/review-iq --env Production
# This must be the SAME connection string Cloud Run uses at runtime (GCP Secret Manager's
# `supabase-database-url`, the review_iq_app pooler DSN).

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours, offset from the hour to avoid GitHub's on-the-hour pile-up
  workflow_dispatch: {}

jobs:
  bypassrls-check:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: BYPASSRLS regression check (read-only, production DB)
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        # --no-cov: pyproject.toml's addopts sets --cov-fail-under=60 globally, which this
        # 2-test, single-file security check can never reach and isn't meant to -- coverage
        # is not a meaningful signal for a role-configuration assertion. Confirmed locally
        # that omitting this makes the run fail on the coverage gate even when the actual
        # BYPASSRLS check itself would pass.
        #
        # -k excludes TestCrossOrgSweepFunctionsSeeEveryOrg (Item 240/241): it needs a
        # superuser connection to seed cross-org rows, which this specific job doesn't have
        # and shouldn't be given -- see the header comment above.
        run: |
          uv run pytest tests/integration/test_role_bypassrls.py -v -m integration --no-cov \
            -k "not TestCrossOrgSweepFunctionsSeeEveryOrg"
