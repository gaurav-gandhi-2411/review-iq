name: Uptime Alert

# Polls /health every 5 minutes (GitHub's minimum cron interval).
# UP means HTTP 200 AND the body contains "status":"ok" -- the same content matcher the
# Cloud Monitoring uptime check api-health uses (CONTAINS_STRING on "status":"ok"). A 200 with
# a maintenance or error page is DOWN.
# On DOWN: opens or updates a GitHub issue and exits 1 (triggers owner email).
# On recovery: closes the open alert issue with a recovery comment.
#
# Limitation: GitHub Actions cron has a documented delay of up to 15 minutes
# during periods of high runner demand. This workflow is not a substitute for
# a paid uptime monitor (Better Uptime, UptimeRobot Pro, etc.) for SLA-grade
# alerting. For the current free-tier portfolio deployment it is sufficient.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_url_override:
        description: "Override HEALTH_URL for this manual run only (e.g. a deliberately-bad URL, to test the alert path end to end). Leave blank for a normal check."
        required: false
        type: string

concurrency:
  group: uptime-alert
  cancel-in-progress: true

permissions:
  issues: write

env:
  HEALTH_URL: "https://api.samidhareviews.xyz/health"
  # Title must be stable so the duplicate-search logic works reliably.
  ALERT_TITLE: "prod /health is DOWN"
  CURL_TIMEOUT: "10"
  # Cloud Run min-instances=0 means cold starts can take ~5s. One retry after
  # a short sleep avoids alerting on transient cold-start latency.
  RETRY_SLEEP: "15"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Probe /health (with cold-start retry)
        id: probe
        env:
          TEST_URL_OVERRIDE: ${{ inputs.test_url_override }}
        run: |
          if [ -n "${TEST_URL_OVERRIDE}" ]; then
            HEALTH_URL="${TEST_URL_OVERRIDE}"
            echo "::warning::Using test_url_override for this manual run: ${HEALTH_URL}"
          fi

          BODY_FILE="${RUNNER_TEMP:-/tmp}/health_body.txt"
          : > "${BODY_FILE}"

          probe() {
            HTTP_STATUS=$(curl -s -o "${BODY_FILE}" -w "%{http_code}" \
              --max-time "${CURL_TIMEOUT}" \
              "${HEALTH_URL}" 2>/dev/null || echo "000")
            # curl -w already prints 000 on a failed connect and the fallback echo appends
            # another, so a refused connection used to read "000000"; keep the last 3 chars.
            echo "${HTTP_STATUS: -3}"
          }

          # Whitespace-insensitive match on the compacted body (the same string the Cloud
          # Monitoring check matches). Sets REASON: empty when UP, else "status" or "content".
          evaluate() {
            REASON=""
            if [ "${STATUS}" != "200" ]; then
              REASON="status"
            else
              # Command substitution (not a pipe) so pipefail/SIGPIPE cannot flip the result.
              COMPACT=$(tr -d ' \t\r\n' < "${BODY_FILE}")
              case "${COMPACT}" in
                *'"status":"ok"'*) ;;
                *) REASON="content" ;;
              esac
            fi
          }

          STATUS=$(probe)
          evaluate
          echo "First probe: HTTP ${STATUS} reason=${REASON:-up}"

          if [ -n "${REASON}" ]; then
            echo "Probe not healthy (${REASON}). Waiting ${RETRY_SLEEP}s for cold-start, then retrying..."
            sleep "${RETRY_SLEEP}"
            STATUS=$(probe)
            evaluate
            echo "Retry probe: HTTP ${STATUS} reason=${REASON:-up}"
          fi

          if [ -z "${REASON}" ]; then UP=true; else UP=false; fi

          # Collapse to a single line before writing to $GITHUB_OUTPUT -- a plain
          # `key=value` line in that file cannot contain an embedded newline. An HTML
          # error-page body (e.g. a Cloud Run/load-balancer 503 page) reliably has
          # newlines, which corrupted this exact line and crashed this step ("Unable to
          # process file command 'output'"), which in turn silently skipped both
          # downstream steps since neither had `always()` in its `if:` -- 15 consecutive
          # failures produced zero GitHub issues before this fix (2026-08-14).
          BODY=$(cat "${BODY_FILE}" 2>/dev/null || echo "(no body)")
          BODY_ONELINE=$(printf '%s' "${BODY:0:500}" | tr '\n\r' '  ')
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "up=${UP}" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          echo "timestamp=${TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "health_url=${HEALTH_URL}" >> "$GITHUB_OUTPUT"
          echo "body=${BODY_ONELINE}" >> "$GITHUB_OUTPUT"

      - name: Handle DOWN
        # always() is load-bearing: without it, this step silently no-ops whenever the
        # probe step itself errors (e.g. the malformed-output-file bug above) instead of
        # running -- the exact failure mode that swallowed every alert for 17+ hours.
        if: always() && steps.probe.outputs.up != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HTTP_STATUS: ${{ steps.probe.outputs.status }}
          REASON: ${{ steps.probe.outputs.reason }}
          TIMESTAMP: ${{ steps.probe.outputs.timestamp }}
          HEALTH_BODY: ${{ steps.probe.outputs.body }}
          HEALTH_URL: ${{ steps.probe.outputs.health_url }}
        run: |
          REPO="${{ github.repository }}"

          # Search for an existing open issue with the exact alert title.
          EXISTING_ISSUE=$(gh issue list \
            --repo "${REPO}" \
            --state open \
            --search "\"${ALERT_TITLE}\" in:title" \
            --json number \
            --jq '.[0].number // empty')

          RUN_URL="https://github.com/${REPO}/actions/runs/${{ github.run_id }}"

          # Say which condition tripped; first 200 chars of the body (already one line).
          if [ "${REASON}" = "content" ]; then
            TRIPPED="content check failed: HTTP 200 but the body lacks \"status\":\"ok\""
          else
            TRIPPED="status check failed: HTTP ${HTTP_STATUS} (expected 200)"
          fi
          BODY_SNIP="${HEALTH_BODY:0:200}"

          if [ -n "${EXISTING_ISSUE}" ]; then
            # Issue already open — add a comment rather than creating a duplicate.
            echo "Existing alert issue #${EXISTING_ISSUE} found. Adding comment."
            gh issue comment "${EXISTING_ISSUE}" \
              --repo "${REPO}" \
              --body "$(cat <<EOF
          Still DOWN at ${TIMESTAMP}

          **HTTP status:** \`${HTTP_STATUS}\`
          **Tripped:** ${TRIPPED}

          **Response body (first 200 chars):**
          \`\`\`
          ${BODY_SNIP}
          \`\`\`

          [Workflow run](${RUN_URL})
          EOF
          )"
          else
            # No open alert issue — create one.
            echo "No existing alert issue found. Creating new issue."
            gh issue create \
              --repo "${REPO}" \
              --title "${ALERT_TITLE}" \
              --body "$(cat <<EOF
          ## prod /health is DOWN

          **Detected at:** ${TIMESTAMP}
          **HTTP status:** \`${HTTP_STATUS}\`
          **Tripped:** ${TRIPPED}
          **Endpoint:** \`${HEALTH_URL}\`

          **Response body (first 200 chars):**
          \`\`\`
          ${BODY_SNIP}
          \`\`\`

          ---

          ### Likely causes

          - Supabase free-plan auto-pause (see \`ops/runbooks/supabase-pause-recovery.md\`)
          - Cloud Run revision unhealthy (see \`ops/runbooks/cloud-run-deploy.md\` → Rollback)
          - DB credentials rotated but service not redeployed (see \`ops/runbooks/secret-rotation.md\`)

          ### Quick triage

          \`\`\`bash
          curl -sf ${HEALTH_URL} | jq .
          # {"status":"unhealthy","db":"unreachable",...} → DB issue
          # timeout / connection refused → Cloud Run issue
          \`\`\`

          [Workflow run that detected this](${RUN_URL})

          ---

          *This issue is managed by the uptime-alert workflow. Do not rename it — the title is used to deduplicate alerts.*
          EOF
          )" \
              --label "incident"
          fi

          # Exit 1 so the workflow run is marked failed → GitHub sends owner email.
          echo "::error::/health DOWN (${TRIPPED}) at ${TIMESTAMP}. See alert issue."
          exit 1

      - name: Handle recovery
        if: always() && steps.probe.outputs.up == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIMESTAMP: ${{ steps.probe.outputs.timestamp }}
        run: |
          REPO="${{ github.repository }}"

          EXISTING_ISSUE=$(gh issue list \
            --repo "${REPO}" \
            --state open \
            --search "\"${ALERT_TITLE}\" in:title" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "${EXISTING_ISSUE}" ]; then
            echo "Recovery detected. Closing alert issue #${EXISTING_ISSUE}."
            gh issue comment "${EXISTING_ISSUE}" \
              --repo "${REPO}" \
              --body "**Recovered** at ${TIMESTAMP} — /health is returning HTTP 200 with status ok again."
            gh issue close "${EXISTING_ISSUE}" \
              --repo "${REPO}" \
              --reason "completed"
          else
            echo "/health is UP (HTTP 200). No open alert issue to close."
          fi
