name: Web Deploy (Cloudflare Pages)

# Wave 2 (production-alias integrity, P1): the react-router migration reached
# app.samidhareviews.xyz unreviewed because `vercel deploy --prod` was run from a
# local working tree -- a deploy with no relationship to git state at all. This
# workflow makes CI-on-main the ONLY sanctioned path to production for web/:
# production deploys never happen from a local `wrangler pages deploy` again.
# (Preview deploys from local are fine -- see CLAUDE.md's standing rule.)
#
# Path-filtered to web/** so unrelated backend-only pushes don't trigger a rebuild.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: web-deploy-production
  cancel-in-progress: false # never cancel a production deploy mid-flight

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy web/dist --project-name=samidha-reviews-web
            --branch=main --commit-hash=${{ github.sha }}
            --commit-message=${{ toJSON(github.event.head_commit.message) }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Verify the deployment we just shipped is ancestor-of-main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          uv run --with httpx python scripts/check_prod_deploy_is_from_main.py
