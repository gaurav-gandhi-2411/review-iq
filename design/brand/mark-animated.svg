<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" width="110" height="110" role="img" aria-label="Samidha Reviews" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    @keyframes swL{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(-9deg) translateY(-1.5px)}}
    @keyframes swR{0%,100%{transform:rotate(14deg)}50%{transform:rotate(19deg) translateY(1.5px)}}
    .dL{transform-origin:42px 58px;animation:swL 4.4s ease-in-out infinite}
    .dR{transform-origin:70px 58px;animation:swR 4.4s ease-in-out infinite;animation-delay:-1.7s}
    @media (prefers-reduced-motion:reduce){.dL,.dR{animation:none}}
  </style>
  <rect width="110" height="110" rx="26" fill="#FAF4EA"/>
  <g class="dL">
    <path d="M42 26 C53 42 58 52 58 61 C58 73 51 80 42 80 C33 80 26 73 26 61 C26 52 31 42 42 26 Z" fill="#F6C042"/>
  </g>
  <g class="dR">
    <path d="M70 26 C81 42 86 52 86 61 C86 73 79 80 70 80 C61 80 54 73 54 61 C54 52 59 42 70 26 Z" fill="#E8823A"/>
  </g>
</svg>
