[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "review-iq"
version = "0.3.0"
description = "Production-grade review intelligence service. Unstructured customer reviews → queryable structured insights."
authors = [{ name = "Gaurav Gandhi", email = "gaurav.gandhi2411@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.15.0",
    "groq>=1.6.0",
    "structlog>=25.1.0",
    "prometheus-client>=0.26.0",
    "slowapi>=0.1.10",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.19",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "google-genai>=2.18.1",
    "supabase>=2.31.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "argon2-cffi>=25.1.0",
    "anthropic>=0.122.0",
    "resend>=2.36.0",
    "cryptography>=42.0.0",
    "python-dateutil>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.16.3",
    "mypy>=2.3.0",
    "types-requests>=2.32.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "lingua-language-detector>=2.1.1",
    "datasets>=4.8.5",
    "kaggle>=2.2.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "eval", "benchmark"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Nested `with` blocks are intentional in tests for clarity; PT011 suppressed
# (appears from ruff >= 0.9 even without PT in select).
"tests/**/*.py" = ["SIM117", "PT011", "B017"]
# Exploratory eval scripts — F841/SIM103 are acceptable in non-app code.
"eval/**/*.py" = ["SIM103", "F841"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
exclude = ["tests/", "eval/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing -v --cov-fail-under=60 -m 'not integration' --ignore=tests/benchmark"
markers = [
    "integration: tests requiring a live Supabase/Postgres connection (run with -m integration)",
]

[tool.coverage.run]
omit = [
    "app/templates/*",
    "app/static/*",
]
