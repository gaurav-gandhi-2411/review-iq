<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Turn customer reviews into structured intelligence — English and Hinglish, measured against real marketplace reviews." />
    <!-- Absolute URLs (Session 12 P6e) -- og:image previously pointed at a relative
         /favicon.svg (an SVG, not a real preview image, and unresolvable by a scraper that
         fetches only the meta tag). app.samidhareviews.xyz is confirmed live (DNS resolves,
         200 on request) -- this is the correct absolute host for this deployment. -->
    <meta property="og:title" content="Samidha Reviews" />
    <meta property="og:description" content="Customer review intelligence for Indian sellers." />
    <meta property="og:image" content="https://app.samidhareviews.xyz/og-image.png" />
    <meta property="og:url" content="https://app.samidhareviews.xyz/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Samidha Reviews" />
    <meta name="twitter:description" content="Customer review intelligence for Indian sellers." />
    <meta name="twitter:image" content="https://app.samidhareviews.xyz/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Samidha Reviews</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
